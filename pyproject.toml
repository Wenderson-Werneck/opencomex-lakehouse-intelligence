[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opencomex-lakehouse-intelligence"
version = "1.0.0"
description = "Open-data international trade intelligence, multimodal supply chain lakehouse, and vessel tracking engine."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Wenderson Werneck", email = "cfpromlk@gmail.com"}
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]
